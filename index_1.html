<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico de Serviços</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Instrument+Serif&family=Raleway:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --preto: #101010;
    --branco: #FFFFFF;
    --vinho: #670d15;
    --cinza: #6b6b6b;
    --linha: #e4e4e4;

    /* Semelhantes disponíveis no Google Fonts:
       Instrument Serif no lugar de Times New Roman MT Condensed,
       Caveat no lugar de Handsome */
    --f-titulo: 'Instrument Serif', 'Times New Roman', Times, serif;
    --f-texto: 'Raleway', 'Helvetica Neue', Arial, sans-serif;
    --f-destaque: 'Caveat', cursive;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--f-texto);
    font-variant-numeric: lining-nums;
    background: var(--branco);
    color: var(--preto);
    font-size: 16px;
    line-height: 1.65;
    min-height: 100vh;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px;
  }

  header {
    padding: 3.5rem 0 2rem;
    border-bottom: 1px solid var(--preto);
  }
  .kicker {
    font-family: var(--f-destaque);
    font-size: 26px;
    line-height: 1;
    color: var(--vinho);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--f-titulo);
    font-weight: 400;
    font-size: clamp(40px, 9vw, 64px);
    line-height: 1;
    letter-spacing: -0.01em;
    margin-bottom: 1rem;
  }
  header p { font-size: 15px; color: var(--cinza); max-width: 500px; }

  main { padding: 2rem 0 4rem; }

  .progress-label {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--cinza);
    margin-bottom: 0.5rem;
  }
  .progress { height: 2px; background: var(--linha); margin-bottom: 2.5rem; }
  .progress-bar { height: 100%; width: 0; background: var(--vinho); transition: width 0.25s; }

  .q-title {
    font-family: var(--f-titulo);
    font-weight: 400;
    font-size: clamp(28px, 6vw, 38px);
    line-height: 1.1;
    margin-bottom: 0.5rem;
  }
  .q-hint { font-size: 14px; color: var(--cinza); margin-bottom: 1.5rem; }
  .q-space { height: 1.5rem; }

  .options { border-top: 1px solid var(--linha); }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 4px;
    border-bottom: 1px solid var(--linha);
    cursor: pointer;
  }
  .option input {
    appearance: none;
    -webkit-appearance: none;
    width: 18px; height: 18px;
    margin-top: 3px;
    flex-shrink: 0;
    border: 1px solid var(--preto);
    border-radius: 50%;
    cursor: pointer;
    display: grid;
    place-content: center;
  }
  .option input[type="checkbox"] { border-radius: 2px; }
  .option input:checked { border-color: var(--vinho); background: var(--vinho); box-shadow: inset 0 0 0 3px var(--branco); }
  .option .opt-text { font-size: 16px; line-height: 1.45; }
  .option .opt-text small { display: block; font-size: 14px; color: var(--cinza); margin-top: 3px; }
  .option:hover .opt-text, .option:has(input:checked) .opt-text { color: var(--vinho); }

  .field { margin-bottom: 1.5rem; }
  .field label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  .field label span { font-weight: 400; color: var(--cinza); }
  input[type="text"], textarea {
    width: 100%;
    padding: 8px 0;
    font: inherit;
    border: none;
    border-bottom: 1px solid var(--preto);
    background: transparent;
    color: var(--preto);
    outline: none;
    border-radius: 0;
    -webkit-appearance: none;
  }
  input[type="text"]:focus, textarea:focus { border-bottom-color: var(--vinho); }
  input::placeholder, textarea::placeholder { color: #a8a8a8; }
  textarea { resize: vertical; min-height: 72px; }

  .error { font-size: 14px; color: var(--vinho); margin-top: 1rem; min-height: 1.4em; }

  .nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 1.5rem; }

  .btn {
    font-family: var(--f-texto);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 14px 26px;
    border: 1px solid var(--preto);
    background: var(--preto);
    color: var(--branco);
    cursor: pointer;
    border-radius: 0;
  }
  .btn:hover { background: var(--vinho); border-color: var(--vinho); }
  .btn.link {
    background: none;
    border: none;
    color: var(--preto);
    padding: 14px 0;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .btn.link:hover { color: var(--vinho); }
  .btn.cta { width: 100%; background: var(--vinho); border-color: var(--vinho); padding: 18px; }
  .btn.cta:hover { background: var(--preto); border-color: var(--preto); }
  .btn[hidden] { display: none; }

  /* Resultado */
  .r-kicker {
    font-family: var(--f-destaque);
    font-size: 28px;
    line-height: 1.1;
    color: var(--vinho);
  }
  .r-name {
    font-family: var(--f-titulo);
    font-weight: 400;
    font-size: clamp(44px, 11vw, 72px);
    line-height: 0.95;
    text-transform: uppercase;
    margin: 0.35rem 0 1.25rem;
  }
  .r-lead { font-size: 17px; margin-bottom: 2rem; }

  .r-why {
    border-left: 2px solid var(--vinho);
    padding: 2px 0 2px 18px;
    margin-bottom: 2.5rem;
  }
  .r-why .label {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--cinza);
    margin-bottom: 4px;
  }
  .r-why p {
    font-family: var(--f-destaque);
    font-size: 24px;
    line-height: 1.3;
    color: var(--vinho);
  }

  .facts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--preto);
    border-bottom: 1px solid var(--preto);
    margin-bottom: 2.5rem;
  }
  .fact { padding: 14px 12px 14px 0; }
  .fact + .fact { padding-left: 12px; border-left: 1px solid var(--linha); }
  .fact .k { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cinza); margin-bottom: 4px; }
  .fact .val { font-size: 15px; font-weight: 500; line-height: 1.35; }
  @media (max-width: 520px) {
    .facts { grid-template-columns: 1fr; }
    .fact, .fact + .fact { padding: 12px 0; border-left: none; }
    .fact + .fact { border-top: 1px solid var(--linha); }
  }

  .r-section { margin-bottom: 2.5rem; }
  .r-section h3 {
    font-family: var(--f-titulo);
    font-weight: 400;
    font-size: 30px;
    line-height: 1.1;
    margin-bottom: 0.75rem;
  }
  .r-section p { font-size: 16px; }
  .r-section p + p { margin-top: 0.75rem; }

  .etapas { list-style: none; counter-reset: etapa; }
  .etapas li {
    counter-increment: etapa;
    display: grid;
    grid-template-columns: 40px 1fr;
    padding: 14px 0;
    border-top: 1px solid var(--linha);
  }
  .etapas li:last-child { border-bottom: 1px solid var(--linha); }
  .etapas li::before {
    content: counter(etapa, decimal-leading-zero);
    font-family: var(--f-titulo);
    font-size: 22px;
    line-height: 1.2;
    color: var(--vinho);
  }
  .etapas strong { display: block; font-weight: 600; }
  .etapas span { font-size: 15px; color: var(--cinza); }

  .para-quem { list-style: none; }
  .para-quem li { position: relative; padding-left: 20px; margin-bottom: 8px; }
  .para-quem li::before {
    content: '';
    position: absolute;
    left: 0; top: 0.7em;
    width: 8px; height: 1px;
    background: var(--vinho);
  }

  .importante {
    font-family: var(--f-destaque);
    font-size: 22px;
    line-height: 1.35;
    color: var(--vinho);
    margin-bottom: 2.5rem;
  }

  .alt { font-size: 14px; color: var(--cinza); margin-top: 1.75rem; }
  .alt button {
    background: none; border: none; font: inherit;
    color: var(--preto); text-decoration: underline; text-underline-offset: 3px;
    cursor: pointer; padding: 0;
  }
  .alt button:hover { color: var(--vinho); }
  .alt p + p { margin-top: 6px; }

  footer { border-top: 1px solid var(--linha); padding: 1.5rem 0 2.5rem; font-size: 12px; color: var(--cinza); }
</style>
</head>
<body>

  const lista = perguntasAtivas();
  const p = lista[passo];
  const total = respostas.perfil === undefined ? null : lista.length;
  $('progressBar').style.width = (total ? (passo / total) * 100 : 0) + '%';
  $('progressLabel').textContent = total ? `Pergunta ${passo + 1} de ${total}` : `Pergunta ${passo + 1}`;

  let corpo;
  if (p.tipo === 'contato') {
    corpo = `
      <div class="field"><label for="cNome">Nome</label>
        <input type="text" id="cNome" value="${esc(contato.nome)}" placeholder="Seu nome"></div>
      <div class="field"><label for="cInsta">@ do Instagram <span>(opcional)</span></label>
        <input type="text" id="cInsta" value="${esc(contato.insta)}" placeholder="@seuperfil"></div>
      <div class="field"><label for="cObs">Quer contar mais alguma coisa? <span>(opcional)</span></label>
        <textarea id="cObs" placeholder="Ex.: nicho, cidade, o que já tentou">${esc(contato.obs)}</textarea></div>`;
  } else {
    const atual = respostas[p.id];
    corpo = `<div class="options">${p.opcoes.map((o, i) => {
      const marcado = p.multi ? (atual || []).includes(i) : atual === i;
      return `<label class="option">
        <input type="${p.multi ? 'checkbox' : 'radio'}" name="q" value="${i}" ${marcado ? 'checked' : ''}>
        <span class="opt-text">${esc(o.v)}${o.hint ? `<small>${esc(o.hint)}</small>` : ''}</span>
      </label>`;
    }).join('')}</div>`;
  }

  const ultimo = passo === lista.length - 1;
  $('quiz').innerHTML = `
    <h2 class="q-title">${esc(p.titulo)}</h2>
    ${p.hint ? `<p class="q-hint">${esc(p.hint)}</p>` : '<div class="q-space"></div>'}
    ${corpo}
    <div class="error" id="erro"></div>
    <div class="nav">
      <button class="btn link" id="voltar" ${passo === 0 ? 'hidden' : ''}>Voltar</button>
      <span></span>
      <button class="btn" id="avancar">${ultimo ? 'Ver meu resultado' : 'Continuar'}</button>
    </div>`;

  $('voltar').onclick = () => { salvar(false); passo--; render(); };
  $('avancar').onclick = () => {
    if (!salvar(true)) return;
    if (ultimo) mostrarResultado();
    else { passo++; render(); }
  };

  // Escolha única: avança sozinho depois do clique
  if (!p.multi && p.tipo !== 'contato') {
    document.querySelectorAll('input[name="q"]').forEach(el => {
      el.addEventListener('change', () => {
        if (!salvar(true)) return;
        setTimeout(() => {
          if (passo === perguntasAtivas().length - 1) mostrarResultado();
          else { passo++; render(); }
        }, 250);
      });
    });
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function salvar(validar) {
  const p = perguntasAtivas()[passo];
  if (p.tipo === 'contato') {
    contato.nome = $('cNome').value.trim();
    contato.insta = $('cInsta').value.trim();
    contato.obs = $('cObs').value.trim();
    if (validar && !contato.nome) { $('erro').textContent = 'Informe seu nome.'; return false; }
    return true;
  }
  const marcados = [...document.querySelectorAll('input[name="q"]:checked')].map(el => Number(el.value));
  if (validar && !marcados.length) { $('erro').textContent = 'Escolha uma opção para continuar.'; return false; }
  if (marcados.length) respostas[p.id] = p.multi ? marcados : marcados[0];
  // Apaga respostas de perguntas que deixaram de valer para este caminho
  PERGUNTAS.forEach(q => { if (q.se && !q.se(respostas)) delete respostas[q.id]; });
  return true;
}

function calcular() {
  const pontos = { orientacao: 0, direcao: 0, mentoria: 0, consultoria: 0, nenhum: 0 };
  perguntasAtivas().forEach(p => {
    if (!p.opcoes || respostas[p.id] === undefined) return;
    const r = respostas[p.id];
    (Array.isArray(r) ? r : [r]).forEach(i => {
      Object.entries(p.opcoes[i].pts || {}).forEach(([s, n]) => { pontos[s] += n; });
    });
  });
  const ranking = Object.keys(pontos).sort((a, b) =>
    pontos[b] - pontos[a] || ORDEM_DESEMPATE.indexOf(a) - ORDEM_DESEMPATE.indexOf(b));
  return { ranking, pontos };
}

function mostrarResultado(escolhido) {
  const { ranking, pontos } = calcular();
  const indicado = ranking[0];
  const chave = escolhido || indicado;
  const alternativa = ranking.find(s => s !== indicado && s !== 'nenhum' && pontos[s] > 0);
  resultadoAtual = chave;

  $('progressBar').style.width = '100%';
  $('progressLabel').textContent = 'Resultado';
  $('quiz').style.display = 'none';

  if (chave === 'nenhum') {
    $('result').innerHTML = `
      <h2 class="r-name">${esc(SEM_SERVICO.titulo)}</h2>
      <div class="r-section">${SEM_SERVICO.texto.map(t => `<p>${esc(t)}</p>`).join('')}</div>
      <div class="alt"><p><button id="refazer">Refazer o diagnóstico</button></p></div>`;
    $('refazer').onclick = refazer;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  const s = SERVICOS[chave];

  const outro = chave !== indicado;
  $('result').innerHTML = `
    <div class="r-kicker">${outro ? 'Você está vendo' : 'O serviço indicado para você é'}</div>
    <h2 class="r-name">${esc(s.nome)}</h2>
    <p class="r-lead">${esc(s.lead)}</p>

    <div class="r-why">
      <div class="label">Por que este serviço</div>
      <p>${esc(s.porque)}</p>
    </div>

    <div class="facts">
      <div class="fact"><div class="k">Duração</div><div class="val">${esc(s.duracao)}</div></div>
      <div class="fact"><div class="k">Investimento</div><div class="val">${esc(s.valor)}</div></div>
      <div class="fact"><div class="k">Pagamento</div><div class="val">${esc(s.pagamento)}</div></div>
    </div>

    <div class="r-section">
      <h3>Como funciona</h3>
      ${s.comoFunciona.map(t => `<p>${esc(t)}</p>`).join('')}
    </div>

    <div class="r-section">
      <h3>Etapas</h3>
      <ol class="etapas">${s.etapas.map(e => `<li><div><strong>${esc(e.titulo)}</strong><span>${esc(e.desc)}</span></div></li>`).join('')}</ol>
    </div>

    <div class="r-section">
      <h3>Para quem é</h3>
      <ul class="para-quem">${s.paraQuem.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    </div>

    ${s.importante ? `<p class="importante">${esc(s.importante)}</p>` : ''}

    <button class="btn cta" id="btnWa">Quero a ${esc(s.nome)}</button>

    <div class="alt">
      ${outro
        ? `<p>Voltar para o serviço indicado: <button data-s="${indicado}">${esc(SERVICOS[indicado].nome)}</button></p>`
        : alternativa ? `<p>Também pode fazer sentido para você: <button data-s="${alternativa}">${esc(SERVICOS[alternativa].nome)}</button></p>` : ''}
      <p><button id="refazer">Refazer o diagnóstico</button></p>
    </div>`;

  $('btnWa').onclick = enviarWhatsApp;
  $('refazer').onclick = refazer;
  document.querySelectorAll('.alt button[data-s]').forEach(b => {
    b.onclick = () => mostrarResultado(b.dataset.s);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function refazer() {
  Object.keys(respostas).forEach(k => delete respostas[k]);
  passo = 0;
  $('result').innerHTML = '';
  $('quiz').style.display = '';
  render();
}

function enviarWhatsApp() {
  const { ranking } = calcular();
  const s = SERVICOS[resultadoAtual];
  const linhas = [
    `Olá! Fiz o diagnóstico e tenho interesse em: *${s.nome}*`,
    resultadoAtual !== ranking[0] ? `(serviço indicado pelo diagnóstico: ${SERVICOS[ranking[0]].nome})` : null,
    '',
    `*Nome:* ${contato.nome}`,
    contato.insta ? `*Instagram:* ${contato.insta}` : null,
    '',
    '*Minhas respostas:*'
  ];
  perguntasAtivas().forEach(p => {
    if (!p.opcoes || respostas[p.id] === undefined) return;
    const r = respostas[p.id];
    const txt = (Array.isArray(r) ? r : [r]).map(i => p.opcoes[i].v).join('; ');
    linhas.push(`• ${p.titulo} ${txt}`);
  });
  if (contato.obs) linhas.push('', `*Observações:* ${contato.obs}`);

  const msg = encodeURIComponent(linhas.filter(l => l !== null).join('\n'));
  window.open(`https://wa.me/${WHATSAPP_DESTINO}?text=${msg}`, '_blank');
}

render();
</script>
</body>
</html>
