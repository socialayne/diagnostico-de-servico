      { v: 'Cerca de 30 dias', hint: 'Para organizar e depois seguir sozinha', pts: { consultoria: 3 } },
      { v: 'Alguns meses', hint: 'Enquanto desenvolvo minha comunicação', pts: { mentoria: 2, direcao: 1 } },
      { v: 'De forma contínua', hint: 'Todos os meses, sem prazo para terminar', pts: { direcao: 2, mentoria: 1 } }
    ]
  },
  {
    id: 'posicionamento', se: r => r.perfil === 1,
    titulo: 'Seu posicionamento está definido?',
    hint: 'O que você faz, para quem e como quer ser percebida.',
    opcoes: [
      { v: 'Sim, está claro', pts: { consultoria: 1 } },
      { v: 'Em parte', pts: { mentoria: 1 } },
      { v: 'Não', pts: { mentoria: 2 } }
    ]
  },
  {
    id: 'momento', se: r => r.perfil === 1,
    titulo: 'Qual é a situação atual da sua rede social?',
    opcoes: [
      { v: 'Ainda não posto ou vou começar do zero' },
      { v: 'Posto, mas sem constância' },
      { v: 'Posto com constância, mas não tenho o resultado que quero' },
      { v: 'Tenho resultado e quero crescer' }
    ]
  },

  // ---- Contato (todos) ----
  { id: 'contato', tipo: 'contato', se: r => r.sm_objetivo !== 1, titulo: 'Para finalizar, seus dados', hint: 'Usados apenas na mensagem que você vai me enviar pelo WhatsApp.' }
];

/* ===================================================================== */

const ORDEM_DESEMPATE = ['nenhum', 'orientacao', 'analise', 'direcao', 'mentoria', 'consultoria'];
const respostas = {};
const contato = { nome: '', insta: '', obs: '' };
let passo = 0;
let resultadoAtual = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function perguntasAtivas() {
  return PERGUNTAS.filter(p => !p.se || p.se(respostas));
}

function render() {
  const lista = perguntasAtivas();
  const p = lista[passo];
  const total = respostas.perfil === undefined ? null : lista.length;
  $('progressBar').style.width = (total ? (passo / total) * 100 : 0) + '%';
  $('progressLabel').textContent = total ? `Pergunta ${passo + 1} de ${total}` : `Pergunta ${passo + 1}`;

  let corpo;
  if (p.tipo === 'contato') {
    corpo = `
      <div class="field"><label for="cNome">Nome</label>
        <input type="text" id="cNome" value="${esc(contato.nome)}" placeholder="Seu nome"></div>
      <div class="field"><label for="cInsta">@ do Instagram <span>(opcional)</span></label>
        <input type="text" id="cInsta" value="${esc(contato.insta)}" placeholder="@seuperfil"></div>
      <div class="field"><label for="cObs">Quer contar mais alguma coisa? <span>(opcional)</span></label>
        <textarea id="cObs" placeholder="Ex.: nicho, cidade, o que já tentou">${esc(contato.obs)}</textarea></div>`;
  } else {
    const atual = respostas[p.id];
    corpo = `<div class="options">${p.opcoes.map((o, i) => {
      const marcado = p.multi ? (atual || []).includes(i) : atual === i;
      return `<label class="option">
        <input type="${p.multi ? 'checkbox' : 'radio'}" name="q" value="${i}" ${marcado ? 'checked' : ''}>
        <span class="opt-text">${esc(o.v)}${o.hint ? `<small>${esc(o.hint)}</small>` : ''}</span>
      </label>`;
    }).join('')}</div>`;
  }

  const ultimo = passo === lista.length - 1;
  $('quiz').innerHTML = `
    <h2 class="q-title">${esc(p.titulo)}</h2>
    ${p.hint ? `<p class="q-hint">${esc(p.hint)}</p>` : '<div class="q-space"></div>'}
    ${corpo}
    <div class="error" id="erro"></div>
    <div class="nav">
      <button class="btn link" id="voltar" ${passo === 0 ? 'hidden' : ''}>Voltar</button>
      <span></span>
      <button class="btn" id="avancar">${ultimo ? 'Ver meu resultado' : 'Continuar'}</button>
    </div>`;

  $('voltar').onclick = () => { salvar(false); passo--; render(); };
  $('avancar').onclick = () => {
    if (!salvar(true)) return;
    if (ultimo) mostrarResultado();
    else { passo++; render(); }
  };

  // Escolha única: avança sozinho depois do clique
  if (!p.multi && p.tipo !== 'contato') {
    document.querySelectorAll('input[name="q"]').forEach(el => {
      el.addEventListener('change', () => {
        if (!salvar(true)) return;
        setTimeout(() => {
          if (passo === perguntasAtivas().length - 1) mostrarResultado();
          else { passo++; render(); }
        }, 250);
      });
    });
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function salvar(validar) {
  const p = perguntasAtivas()[passo];
  if (p.tipo === 'contato') {
    contato.nome = $('cNome').value.trim();
    contato.insta = $('cInsta').value.trim();
    contato.obs = $('cObs').value.trim();
    if (validar && !contato.nome) { $('erro').textContent = 'Informe seu nome.'; return false; }
    return true;
  }
  const marcados = [...document.querySelectorAll('input[name="q"]:checked')].map(el => Number(el.value));
  if (validar && !marcados.length) { $('erro').textContent = 'Escolha uma opção para continuar.'; return false; }
  if (marcados.length) respostas[p.id] = p.multi ? marcados : marcados[0];
  // Apaga respostas de perguntas que deixaram de valer para este caminho
  PERGUNTAS.forEach(q => { if (q.se && !q.se(respostas)) delete respostas[q.id]; });
  return true;
}

function calcular() {
  const pontos = { orientacao: 0, analise: 0, direcao: 0, mentoria: 0, consultoria: 0, nenhum: 0 };
  perguntasAtivas().forEach(p => {
    if (!p.opcoes || respostas[p.id] === undefined) return;
    const r = respostas[p.id];
    (Array.isArray(r) ? r : [r]).forEach(i => {
      Object.entries(p.opcoes[i].pts || {}).forEach(([s, n]) => { pontos[s] += n; });
    });
  });
  // Empate: vence o serviço que a pessoa pediu na pergunta "desejo"
  const perguntaDesejo = PERGUNTAS.find(p => p.id === 'desejo');
  const pedido = respostas.desejo !== undefined
    ? Object.keys(perguntaDesejo.opcoes[respostas.desejo].pts)[0]
    : null;
  const desempate = s => (s === pedido ? -1 : ORDEM_DESEMPATE.indexOf(s));
  const ranking = Object.keys(pontos).sort((a, b) =>
    pontos[b] - pontos[a] || desempate(a) - desempate(b));
  return { ranking, pontos };
}

function mostrarResultado(escolhido) {
  const { ranking, pontos } = calcular();
  const indicado = ranking[0];
  const chave = escolhido || indicado;
  const alternativa = ranking.find(s => s !== indicado && s !== 'nenhum' && pontos[s] > 0);
  resultadoAtual = chave;

  $('progressBar').style.width = '100%';
  $('progressLabel').textContent = 'Resultado';
  $('quiz').style.display = 'none';

  if (chave === 'nenhum') {
    $('result').innerHTML = `
      <h2 class="r-name">${esc(SEM_SERVICO.titulo)}</h2>
      <div class="r-section">${SEM_SERVICO.texto.map(t => `<p>${esc(t)}</p>`).join('')}</div>
      <div class="alt"><p><button id="refazer">Refazer o diagnóstico</button></p></div>`;
    $('refazer').onclick = refazer;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  const s = SERVICOS[chave];

  const outro = chave !== indicado;
  $('result').innerHTML = `
    <div class="r-kicker">${outro ? 'Você está vendo' : 'O serviço indicado para você é'}</div>
    <h2 class="r-name">${esc(s.nome)}</h2>
    <p class="r-lead">${esc(s.lead)}</p>

    <div class="r-why">
      <div class="label">Por que este serviço</div>
      ${Array.isArray(s.porque) ? `<ul>${s.porque.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : `<p>${esc(s.porque)}</p>`}
    </div>

    <div class="facts">
      <div class="fact"><div class="k">Duração</div><div class="val">${esc(s.duracao)}</div></div>
      <div class="fact"><div class="k">Investimento</div><div class="val">${esc(s.valor)}</div></div>
      <div class="fact"><div class="k">Pagamento</div><div class="val">${esc(s.pagamento)}</div></div>
    </div>

    <div class="r-section">
      <h3>Como funciona</h3>
      ${s.comoFunciona.map(t => `<p>${esc(t)}</p>`).join('')}
    </div>

    <div class="r-section">
      <h3>Etapas</h3>
      <ol class="etapas">${s.etapas.map(e => `<li><div><strong>${esc(e.titulo)}</strong><span>${esc(e.desc)}</span></div></li>`).join('')}</ol>
    </div>

    <div class="r-section">
      <h3>Para quem é</h3>
      <ul class="para-quem">${s.paraQuem.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    </div>

    ${s.importante ? `<p class="importante">${esc(s.importante)}</p>` : ''}

    <button class="btn cta" id="btnWa">Quero ${s.artigo || 'a'} ${esc(s.nome)}</button>

    <div class="alt">
      ${outro
        ? `<p>Voltar para o serviço indicado: <button data-s="${indicado}">${esc(SERVICOS[indicado].nome)}</button></p>`
        : alternativa ? `<p>Também pode fazer sentido para você: <button data-s="${alternativa}">${esc(SERVICOS[alternativa].nome)}</button></p>` : ''}
      <p><button id="refazer">Refazer o diagnóstico</button></p>
    </div>`;

  $('btnWa').onclick = enviarWhatsApp;
  $('refazer').onclick = refazer;
  document.querySelectorAll('.alt button[data-s]').forEach(b => {
    b.onclick = () => mostrarResultado(b.dataset.s);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function refazer() {
  Object.keys(respostas).forEach(k => delete respostas[k]);
  passo = 0;
  $('result').innerHTML = '';
  $('quiz').style.display = '';
  render();
}

function enviarWhatsApp() {
  const { ranking } = calcular();
  const s = SERVICOS[resultadoAtual];
  const linhas = [
    `Olá! Fiz o diagnóstico e tenho interesse em: *${s.nome}*`,
    resultadoAtual !== ranking[0] ? `(serviço indicado pelo diagnóstico: ${SERVICOS[ranking[0]].nome})` : null,
    '',
    `*Nome:* ${contato.nome}`,
    contato.insta ? `*Instagram:* ${contato.insta}` : null,
    '',
    '*Minhas respostas:*'
  ];
  perguntasAtivas().forEach(p => {
    if (!p.opcoes || respostas[p.id] === undefined) return;
    const r = respostas[p.id];
    const txt = (Array.isArray(r) ? r : [r]).map(i => p.opcoes[i].v).join('; ');
    linhas.push(`• ${p.titulo} ${txt}`);
  });
  if (contato.obs) linhas.push('', `*Observações:* ${contato.obs}`);

  const msg = encodeURIComponent(linhas.filter(l => l !== null).join('\n'));
  window.open(`https://wa.me/${WHATSAPP_DESTINO}?text=${msg}`, '_blank');
}

render();
</script>
</body>
</html>
